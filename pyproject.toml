[project]
name = "pystonic"
dynamic = ["version"]
description = "Python 应用基石"
readme = "README.md"
authors = [{ name = "BytemanD", email = "byteman.e@outlook.com" }]
requires-python = ">=3.12"
dependencies = [
    "distro>=1.9.0",
    "httpx>=0.28.1",
    "humanize>=4.15.0",
    "loguru>=0.7.3",
    "pluggy>=1.5.0",
    "pydantic-settings[toml]>=2.9.1",
    "pymysql>=1.2.0",
    "python-dateutil>=2.9.0.post0",
    "retry>=0.9.2",
    "setproctitle>=1.3.7",
    "termcolor>=3.3.0",
    "toml>=0.10.2",
]

[project.scripts]
pystonic = "pystonic.cmd.main:main"
pystonic-tools = "pystonic.cmd.main:main"
[project.optional-dependencies]
pretty = [
    "rich>=14.3.3",
    "prettytable>=3.17.0",
]
orm = [
    "sqlmodel>=0.0.38",
]
mcp = [
    "fastmcp==3.4.2",
    "nacos-sdk-python==2.0.9",
    "nacos-maintainer-sdk-python==0.1.2",
]
asgi = [
    "fastapi>=0.162.0",
    "uvicorn>=0.52.1",
]
agent = [
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.3",
    "langgraph-checkpoint-mysql[asyncmy]>=3.0.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "openai>=2.52.0",
    "openai-agents>=0.18.3",
]
huey = [
    "huey[peewee,redis,sql,sqlite]>=3.4.0",
    "peewee>=4.4.0",
    "pymysql>=1.2.0",
]
# cmd = [
#     "click>=8.4.2",
# ]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.4",
    "bandit>=1.9.4",
    "gitpython>=3.1.46",
]
apscheduler = [
    "apscheduler>=3.11.3",
]
infra = [
    "boto3>=1.43.117",
    "docker>=7.2.0",
    "portalocker>=4.4.1",
    "psutil>=7.2.2",
    "redis>=8.1.0",
]
milvus = [
    "chroma>=0.2.0",
    "pymilvus[model]>=3.0.2",
]
chroma = [
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.0",
    "langchain-text-splitters>=1.1.3",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"


[[tool.uv.index]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple"
publish-url = "https://test.pypi.org/legacy/"
explicit = true


[tool.pytest]
minversion = "9.0"
addopts = ["-ra"]
