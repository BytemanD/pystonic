[project]
name = "pystonic"
dynamic = ["version"]
description = "Python 应用基石"
readme = "README.md"
authors = [{ name = "BytemanD", email = "byteman.e@outlook.com" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "humanize>=4.15.0",
    "loguru>=0.7.3",
    "pluggy>=1.5.0",
    "pydantic-settings[toml]>=2.9.1",
    "python-dateutil>=2.9.0.post0",
    "sqlmodel>=0.0.38",
    "termcolor>=3.3.0",
    "toml>=0.10.2",
]

[project.scripts]
pystonic = "pystonic.cmd.pystonic:main"

[project.optional-dependencies]
rich = [
    "rich>=14.3.3",
]
prettytable = [
    "prettytable>=3.17.0",
]
gitstats = [
    "gitpython>=3.1.46",
    "rich>=14.3.3",
]
orm = [
    "sqlalchemy>=2.0.49",
]
fastapi = [
    "fastapi>=0.136.3",
]
mcp = [
    "fastmcp==3.4.2",
    "nacos-sdk-python==2.0.9",
    "nacos-maintainer-sdk-python==0.1.2"
]
ai = [
    "chromadb>=1.5.9",
    "opentelemetry-exporter-otlp-proto-grpc==1.42.1",
    "opentelemetry-proto==1.42.1",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[dependency-groups]
agent = [
    "openai>=2.52.0",
    "openai-agents>=0.18.3",
]
cmd = [
    "click>=8.4.2",
]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.4",
]

[[tool.uv.index]]
name = "tencent"
url = "http://mirrors.cloud.tencent.com/pypi/simple"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple"
publish-url = "https://test.pypi.org/legacy/"
explicit = true


[tool.pytest]
minversion = "9.0"
addopts = ["-ra"]
